name: Weekly health

# This repository checks itself with its own action, which is the honest test
# of whether it works: a tool for noticing rot that is rotting unseen would be
# a poor advertisement.
on:
  schedule:
    - cron: "43 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
